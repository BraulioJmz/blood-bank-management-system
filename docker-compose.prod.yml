# Despliegue completo con un comando:
#   docker compose -f docker-compose.prod.yml up --build -d     →  http://localhost:8080
# Proyecto con nombre propio: sus volúmenes no se mezclan con los de desarrollo.
# Los secretos salen de .env y NO tienen valores por defecto (`:?` falla si faltan).
name: banco-sangre-prod

x-bd: &bd
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-banco}
  DB_OWNER_USER: ${DB_OWNER_USER:-banco_owner}
  DB_APP_USER: ${DB_APP_USER:-app_login}
  DB_APP_PASSWORD: ${DB_APP_PASSWORD:?define DB_APP_PASSWORD en .env}
  TZ: America/Mexico_City

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    # Mismo archivado continuo de WAL que en desarrollo (base del PITR).
    entrypoint: ["sh", "-c", "mkdir -p /wal_archive && chown postgres:postgres /wal_archive && exec docker-entrypoint.sh \"$$@\"", "--"]
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - archive_timeout=60
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchivo:/wal_archive
    # Sin `ports`: PostgreSQL solo es accesible dentro de la red de Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrador:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      <<: *bd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?define DB_OWNER_PASSWORD en .env}
      # Datos sintéticos solo la primera vez (si no hay donantes). 0 para una base vacía.
      SINTETICO_UNIDADES: ${SINTETICO_UNIDADES:-5000}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *bd
      API_PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    depends_on:
      migrador:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  walarchivo:
